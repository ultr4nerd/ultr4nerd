name: Update profile stats

on:
  schedule:
    - cron: "17 * * * *" # hourly; commits only when something changed
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/**, data/config.json, assets/fonts/**, art/**]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    env:
      HAS_SPOTIFY: ${{ secrets.SPOTIFY_REFRESH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch stats
        env:
          # A classic PAT with read:user lets the calendar include private contributions.
          # Falls back to the workflow token (public contributions only).
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_stats.py

      - name: Fetch now playing (Spotify)
        if: ${{ env.HAS_SPOTIFY == 'true' }}
        continue-on-error: true
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: pip install -q pillow && python scripts/fetch_spotify.py

      - name: Render widgets
        run: python scripts/render.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data assets README.md
          git diff --cached --quiet && echo "nothing changed" && exit 0
          git commit -m "chore: refresh profile stats"
          git push
